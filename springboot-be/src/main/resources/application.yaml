spring:
  application:
    name: MeoSocial
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      repositories:
        enabled: 'false'
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 60s
  datasource:
    url: ${RW_MYSQL_DATABASE_URL}
    username: ${RW_MYSQL_DATABASE_NAME}
    password: ${RW_MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'
server:
  servlet:
    context-path: /api/v1
app:
  jwtSecretKey: ${JWT_SECRET_KEY}
  jwtExpirationMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationMs: ${REFRESH_TOKEN_EXPIRATION_MS}
