version: '3.8'
services:
  server:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      RW_MYSQL_DATABASE_URL: ${RW_MYSQL_DATABASE_URL}
      RW_MYSQL_DATABASE_NAME: ${RW_MYSQL_DATABASE_NAME}
      MYSQL_USER: ${MYSQL_USER}
      RW_MYSQL_ROOT_PASSWORD: ${RW_MYSQL_ROOT_PASSWORD}
      RW_MYSQL_HOST: ${RW_MYSQL_HOST}
      RW_MYSQL_PORT: ${RW_MYSQL_PORT}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL}

      CLOUDINARY_URL: ${CLOUDINARY_URL}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS}